# Конфигурация Streamlit для проекта «AI-конструктор КП».
#
# client.toolbarMode = "viewer" скрывает встроенную кнопку «Deploy» в правом
# верхнем углу и её англоязычное меню (перевести её нельзя — это код Streamlit).
# Вместо неё в приложении есть вкладка «🚀 Развёртывание»
# (страница «5 · Настройки») — те же команды, но на русском.
[client]
toolbarMode = "viewer"

# Тема оформления: вариант 3 «Изумрудный» (выбран пользователем).
# Светлая основа, изумрудные акценты, «мягкая» подложка сайдбара/таблиц.
[theme]
base = "light"
primaryColor = "#0B7A4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F7F4"
textColor = "#263238"
font = "sans serif"